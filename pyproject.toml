[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbto-reproduction"
version = "0.1.0"
description = "Best-effort research reproduction of PBTO for class-incremental learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "Pillow>=10.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.8", "scikit-learn>=1.3"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
